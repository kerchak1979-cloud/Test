// ========== ЛОГИКА ТРЕНАЖЁРА ==========
let answered = 0;
let correctCount = 0;
let wrongCount = 0;
let locked = false;

function renderQuestions() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q-' + i;
    card.innerHTML = `
      <span class="q-num">Вопрос ${i + 1}</span>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts-${i}">
        ${q.opts.map((opt, j) => `
          <label class="option" id="opt-${i}-${j}">
            <input type="radio" name="q${i}" value="${j}" onchange="checkAnswer(${i}, ${j})">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="feedback" id="fb-${i}" style="display:none;"></div>
    `;
    container.appendChild(card);
  });
}

function checkAnswer(qIndex, selected) {
  if (locked) return;
  const q = QUESTIONS[qIndex];
  const card = document.getElementById('q-' + qIndex);
  const feedback = document.getElementById('fb-' + qIndex);

  // Блокируем все опции этого вопроса
  const options = document.querySelectorAll(`#opts-${qIndex} .option`);
  options.forEach(opt => opt.classList.add('disabled'));

  // Подсвечиваем правильный ответ
  const correctOpt = document.getElementById(`opt-${qIndex}-${q.correct}`);
  correctOpt.classList.add('correct-answer');

  if (selected === q.correct) {
    card.classList.add('correct');
    feedback.className = 'feedback ok';
    feedback.textContent = '✅ Правильно!';
    correctCount++;
  } else {
    card.classList.add('wrong');
    const wrongOpt = document.getElementById(`opt-${qIndex}-${selected}`);
    wrongOpt.classList.add('wrong-answer');
    feedback.className = 'feedback no';
    feedback.textContent = '❌ Неправильно. Правильный ответ выделен зелёным.';
    wrongCount++;
  }
  feedback.style.display = 'block';

  answered++;
  updateStats();

  // Если все вопросы отвечены — показываем итог
  if (answered === QUESTIONS.length) {
    showSummary();
  }
}

function updateStats() {
  document.getElementById('answered').textContent = answered;
  document.getElementById('correct').textContent = correctCount;
  document.getElementById('wrong').textContent = wrongCount;
  const percent = (answered / QUESTIONS.length) * 100;
  document.getElementById('progress').style.width = percent + '%';
}

function showSummary() {
  const summary = document.getElementById('resultSummary');
  const percent = Math.round((correctCount / QUESTIONS.length) * 100);
  summary.classList.add('show');
  if (percent >= 80) {
    summary.className = 'result-summary show good';
    summary.innerHTML = `<h3>🎉 Отличный результат!</h3><p>Вы ответили правильно на <b>${correctCount}</b> из <b>${QUESTIONS.length}</b> вопросов (<b>${percent}%</b>).</p>`;
  } else if (percent >= 50) {
    summary.className = 'result-summary show good';
    summary.innerHTML = `<h3>👍 Хороший результат</h3><p>Вы ответили правильно на <b>${correctCount}</b> из <b>${QUESTIONS.length}</b> вопросов (<b>${percent}%</b>). Стоит повторить отдельные темы.</p>`;
  } else {
    summary.className = 'result-summary show bad';
    summary.innerHTML = `<h3>📚 Нужно повторить материал</h3><p>Вы ответили правильно на <b>${correctCount}</b> из <b>${QUESTIONS.length}</b> вопросов (<b>${percent}%</b>). Рекомендуется вернуться к лекциям.</p>`;
  }
}

function resetAll() {
  answered = 0;
  correctCount = 0;
  wrongCount = 0;
  locked = false;
  document.getElementById('resultSummary').classList.remove('show');
  document.getElementById('resultSummary').className = 'result-summary';
  renderQuestions();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Инициализация
renderQuestions();
updateStats();
</script>
</body>
</html>
